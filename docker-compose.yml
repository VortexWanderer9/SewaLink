services:
  postgres:
    image: postgres:16-alpine
    container_name: sewalink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sewalink}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sewalink}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: sewalink-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sewalink}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-change-me-min-32-chars-long}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-refresh-change-me}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE: 10485760
      ESEWA_MERCHANT_ID: ${ESEWA_MERCHANT_ID:-EPAYTEST}
      ESEWA_SECRET_KEY: ${ESEWA_SECRET_KEY:-test}
      ESEWA_BASE_URL: ${ESEWA_BASE_URL:-https://uat.esewa.com.np}
      KHALTI_PUBLIC_KEY: ${KHALTI_PUBLIC_KEY:-test_public_key}
      KHALTI_SECRET_KEY: ${KHALTI_SECRET_KEY:-test_secret_key}
      KHALTI_BASE_URL: ${KHALTI_BASE_URL:-https://a.khalti.com/api/v2}
      IMEPAY_MERCHANT_ID: ${IMEPAY_MERCHANT_ID:-test}
      IMEPAY_SECRET_KEY: ${IMEPAY_SECRET_KEY:-test}
      IMEPAY_BASE_URL: ${IMEPAY_BASE_URL:-https://stg.imepay.com.np/api/v1}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - backend_uploads:/app/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: sewalink-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
  backend_uploads:
